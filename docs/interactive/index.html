  body:`<p>Every request makes the same trip: the browser holds <b>UI state</b> (what's on screen right now); the API owns <b>data state</b> (what's actually true, in Postgres). The API is <b>stateless</b> &mdash; it keeps nothing in memory between requests. Every request carries its own JWT, so any running instance of the API can answer it, which is exactly what lets <a href="../../../Chain-C/Kubernetes-IaC-Deployment" style="color:#67e8f9">C-4</a> run several copies behind a load balancer.</p>

  body:`<p>Auth is a four-step pipeline, and <code>app/security.py</code> implements exactly these four functions. The password is <b>never stored</b> &mdash; only its bcrypt hash (<code>hash_password</code>). The token is <b>signed, not encrypted</b>: anyone who intercepts it can read the payload (<code>{"sub": "42", "exp": ...}</code>) in plain text by just base64-decoding it, but only the server &mdash; the one holding <code>SECRET_KEY</code> &mdash; can produce a signature that <code>decode_token</code> will accept as valid.</p>
  <p><b>The trap:</b> "signed" gets misread as "encrypted," and that misreading has a real consequence. Say a future feature adds the user's role to the token for a quick client-side check: <code>payload = {"sub": subject, "role": user.role, "exp": expire}</code>. That role claim is now sitting in plain text in a token the browser stores and the network carries &mdash; anyone who captures that request (a coworker on the same Wi-Fi, a misconfigured logging proxy) can read it with zero cryptography, just <code>atob()</code> on the middle segment. The signature stops someone from <i>forging</i> a token; it does nothing to stop someone from <i>reading</i> one. Anything secret has no business inside a JWT payload.</p>`,

  short:"3. React Query",
  title:"3 — React Query: Server State",
  body:`<p><code>useEffect</code> + <code>useState</code> reinvents loading flags, caching, and refetch logic in every single component that needs server data. React Query (TanStack Query) does it once, centrally: <code>useJobs()</code> fetches and caches under the key <code>["jobs"]</code>; any component calling it shares that one cache entry instead of each firing its own fetch.</p>
  <p><b>The trap:</b> a mutation succeeding does not, by itself, change anything on screen — <code>useCreateJob</code>'s <code>mutationFn</code> posts the new job and gets a <code>201</code> back, but the <code>["jobs"]</code> query cache still holds the old list until something tells it to refetch. Say a hiring manager posts a job and the UI doesn't call <code>invalidateQueries</code> afterward: the POST genuinely succeeded (it's in the database, a page refresh would show it), but the manager is staring at a job list that hasn't changed and reasonably assumes the submission failed. <code>onSuccess: () => qc.invalidateQueries({queryKey:["jobs"]})</code> is what closes that gap — it marks the cache stale and triggers the refetch that makes the new job actually appear.</p>`,

  short:"4. Migrations",
  title:"4 — Database Migrations",
  body:`<p>The schema changes over time as <code>app/models.py</code> grows. Alembic turns each change into a <b>versioned, reversible</b> file so every environment &mdash; your machine, a teammate's, Railway in production &mdash; converges to the same shape by replaying the same steps, instead of each one drifting based on whoever last ran a manual <code>ALTER TABLE</code>.</p>
  <p><b>The trap:</b> <code>alembic revision --autogenerate</code> diffs your models against the live schema and writes the "obvious" migration &mdash; but it compares by name, so a rename looks identical to a drop-and-add. Say a later pass on this project renames <code>Job.location</code> to <code>Job.city</code> directly in <code>models.py</code>. Autogenerate doesn't see "location became city" &mdash; it sees a column named <code>location</code> that's gone and an unrelated column named <code>city</code> that's new, and writes <code>drop_column("location")</code> + <code>add_column("city")</code>. Run that migration against a database with real rows and every existing job silently loses its location data, because the generated migration has no idea the two columns were ever related. The fix is to open the generated file and hand-edit it into <code>op.alter_column("jobs", "location", new_column_name="city")</code> before running it &mdash; autogenerate is a draft, not an authority.</p>`,

const el = id => document.getElementById(id);

const QC_KEY = 'chainC_fullStackJobBoard_v1';
function loadQC(){ try{ const raw = localStorage.getItem(QC_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; } }
const QC_SAVED = loadQC();
const qcAnswered = (QC_SAVED && Array.isArray(QC_SAVED.qcAnswered) && QC_SAVED.qcAnswered.length===LESSONS.length)
  ? QC_SAVED.qcAnswered.slice() : new Array(LESSONS.length).fill(false);
let bestQuizScore = (QC_SAVED && typeof QC_SAVED.quizScore === 'number') ? QC_SAVED.quizScore : null;
function saveQC(){ try{ localStorage.setItem(QC_KEY, JSON.stringify({qcAnswered, quizScore: bestQuizScore})); } catch(e){} }

function renderCL(links){
  if(!links || !links.length) return '';
  const rows = links.map(l=>'<a href="'+l.url+'" target="_blank" rel="noopener"><span class="tag">'+(l.type==='watch'?'Watch':'Read')+'</span>'+l.label+'</a>').join('');
  return '<div class="cl"><div class="cap">📚 Continue Learning</div>'+rows+'</div>';
}
function renderQC(idx){
  const l = LESSONS[idx];
  if(!l.quickCheck) return '';
  const done = qcAnswered[idx];
  const q = l.quickCheck;
  const opts = q.options.map((o,oi)=>'<button class="qcopt '+(done && o.ok?'ok':'')+'" data-oi="'+oi+'" '+(done?'disabled':'')+'>'+o.t+'</button>').join('');
  return '<div class="qc"><div class="cap">✓ Quick Check</div><div class="qt">'+q.q+'</div>'+
    '<div id="qcopts-'+idx+'">'+opts+'</div>'+
    '<div class="qcexplain" id="qcexplain-'+idx+'" style="'+(done?'display:block':'')+'">'+q.explain+'</div>'+
    (done?'':'<div class="note" style="margin-top:8px">Answer to unlock &ldquo;Next&rdquo;.</div>')+'</div>';
}
function pickQC(lessonIdx, oi){
  if(qcAnswered[lessonIdx]) return;
  qcAnswered[lessonIdx]=true;
  const q=LESSONS[lessonIdx].quickCheck;
  document.querySelectorAll('#qcopts-'+lessonIdx+' .qcopt').forEach((b,bi)=>{
    b.disabled=true; if(q.options[bi].ok) b.classList.add('ok'); else if(bi===oi) b.classList.add('bad');
  });
  el('qcexplain-'+lessonIdx).style.display='block';
  saveQC();
  updateNextEnabled();
}
function updateNextEnabled(){
  const nb = el('nextBtn');
  if(nb) nb.disabled = !qcAnswered[i];
}

function render(){
  const l = LESSONS[i];
  el('lesson').innerHTML = '<h2>'+l.title+'</h2>'+l.body+renderCL(l.continueLearning)+renderQC(i);
  const qcContainer = el('qcopts-'+i);
  if(qcContainer){ qcContainer.querySelectorAll('.qcopt').forEach(btn=>{ btn.onclick=()=>pickQC(i, +btn.dataset.oi); }); }
  el('practice').innerHTML = '<h3>Diagram + Code</h3>' + l.diagram + '<pre>'+l.code.replace(/</g,'&lt;')+'</pre>';
  el('counter').textContent=(i+1)+' / '+LESSONS.length;
  document.querySelectorAll('.pill').forEach((p,idx)=>p.classList.toggle('active',idx===i));
  updateNextEnabled();
}
function go(d){ i=Math.max(0,Math.min(LESSONS.length-1,i+d)); render(); }
function showLesson(){
  el('quizPanel').style.display='none';
  el('toolPanel').style.display='none';
  document.querySelector('main').style.display='grid';
  document.querySelector('nav').style.display='flex';
}

const QUIZ = [
  {q:"Why does keeping the API stateless matter once C-4 scales it to multiple replicas?",
   options:[{t:"A JWT proves identity on its own, so any replica can answer a request without a shared server-side session",ok:true},{t:"Stateless APIs use less disk space",ok:false},{t:"It only matters for the database, not the API",ok:false}],
   explain:"An in-memory session lives on one process. A self-contained JWT has no such blind spot — any replica can verify it independently."},
  {q:"Why is it safe for a JWT's signature to travel over the network, but not safe to put a secret inside its payload?",
   options:[{t:"The signature proves authenticity without revealing SECRET_KEY; the payload itself is just base64 — readable by anyone who has the token",ok:true},{t:"Both the signature and payload are fully encrypted",ok:false},{t:"Neither the signature nor the payload can be read without HTTPS",ok:false}],
   explain:"Signing (HMACSHA256 with SECRET_KEY) proves the token wasn't forged. It does nothing to hide the payload's contents from anyone who intercepts the token."},
  {q:"After useCreateJob's mutation succeeds, what makes the on-screen job list actually update?",
   options:[{t:"The POST response automatically pushes the new job into every component",ok:false},{t:"onSuccess calling invalidateQueries({queryKey:[\"jobs\"]}), which marks the cache stale and triggers a refetch",ok:true},{t:"The browser automatically refreshes the page",ok:false}],
   explain:"A successful mutation and a stale cache are two separate facts until invalidateQueries explicitly connects them."},
  {q:"Job.location gets renamed to Job.city in models.py. What will `alembic revision --autogenerate` actually generate?",
   options:[{t:"alter_column with new_column_name=\"city\", preserving existing data",ok:false},{t:"drop_column(\"location\") + add_column(\"city\") — it can't detect renames, only additions/removals",ok:true},{t:"Nothing — it refuses to run until you resolve the rename manually first",ok:false}],
   explain:"Autogenerate compares the model and the live schema by column name. A rename looks like an unrelated drop + add, and running it as-is would silently discard every row's existing value."},
  {q:"In create_job, the 403 check for non-employers runs AFTER get_current_user has already authenticated the caller. Why separate these two checks?",
   options:[{t:"Authentication (who you are) and authorization (what you're allowed to do) are different questions — collapsing them risks letting an authenticated-but-wrong-role user through",ok:true},{t:"FastAPI requires all checks to happen in this specific order",ok:false},{t:"It's purely a performance optimization",ok:false}],
   explain:"get_current_user proves identity. The is_employer check decides permission for that already-identified user — conflating the two is how a logged-in user ends up doing something only a different role should be allowed to do."},
  {q:"Why do Job and Application use cascade=\"all, delete-orphan\" on their relationship to User?",
   options:[{t:"It makes queries run faster",ok:false},{t:"Deleting a User also deletes their Jobs/Applications, so no row is left pointing at a user_id that no longer exists",ok:true},{t:"It's required syntax with no functional effect",ok:false}],
   explain:"Without cascade delete, removing a user would either fail on the foreign key constraint or leave orphaned rows pointing at a deleted user — cascade keeps the data consistent."}
];
let qi=0, qscore=0, qansw=false;
function openQuiz(){
  document.querySelector('main').style.display='none';
  document.querySelector('nav').style.display='none';
  el('quizPanel').style.display='block';
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el('quizpill').classList.add('active');
  qi=0; qscore=0; renderQuiz();
}
function renderQuiz(){
  qansw=false;
  const it=QUIZ[qi];
  el('quizPanel').innerHTML='<h2>Check Your Understanding</h2>'+
    '<div class="qtext">'+(qi+1)+' / '+QUIZ.length+' &mdash; '+it.q+'</div><div id="qopts"></div>'+
    '<div class="qexplain" id="qexplain">'+it.explain+'</div>'+
    '<div class="qfoot"><span class="sc" id="qsc">Score: '+qscore+' / '+QUIZ.length+'</span>'+
    '<button class="ghost" id="qnext" disabled onclick="nextQuiz()">'+(qi===QUIZ.length-1?'See score →':'Next →')+'</button></div>';
  const o=el('qopts');
  it.options.forEach((op,idx)=>{const b=document.createElement('button');b.className='qopt';b.textContent=op.t;b.onclick=(e)=>pickQuiz(idx,e.currentTarget);o.appendChild(b);});
}
function pickQuiz(idx,btn){
  if(qansw)return; qansw=true;
  const it=QUIZ[qi];
  el('qopts').querySelectorAll('.qopt').forEach((b,i2)=>{b.disabled=true;if(it.options[i2].ok)b.classList.add('ok');});
  if(it.options[idx].ok){qscore++;el('qsc').textContent='Score: '+qscore+' / '+QUIZ.length;} else btn.classList.add('bad');
  el('qexplain').style.display='block'; el('qnext').disabled=false;
}
function nextQuiz(){ qi++; if(qi<QUIZ.length)renderQuiz(); else finishQuiz(); }
function finishQuiz(){
  const pct=Math.round(qscore/QUIZ.length*100);
  const msg=pct===100?'Perfect — you’ve got this.':pct>=70?'Solid understanding.':pct>=40?'Good start — revisit the lessons you missed.':'Worth another pass through the lessons.';
  el('quizPanel').innerHTML='<h2>Check Your Understanding</h2><div class="qtext">You scored '+qscore+' / '+QUIZ.length+' ('+pct+'%)</div><p>'+msg+'</p>'+
    '<button class="ghost" onclick="restartQuiz()">↺ Retake</button> <button class="ghost" onclick="showLesson()">← Back to lessons</button>';
  bestQuizScore = (bestQuizScore===null) ? qscore : Math.max(bestQuizScore, qscore);
  saveQC();
}
function restartQuiz(){ qi=0; qscore=0; renderQuiz(); }

function letterGrade(pct){
  if(pct===null) return {text:'—',cls:'grade-dash'};
  if(pct>=90) return {text:'A',cls:'grade-A'};
  if(pct>=80) return {text:'B',cls:'grade-B'};
  if(pct>=70) return {text:'C',cls:'grade-C'};
  if(pct>=60) return {text:'D',cls:'grade-D'};
  return {text:'F',cls:'grade-F'};
}
function renderReportCard(){
  const qcDone = qcAnswered.filter(Boolean).length;
  const attempted = bestQuizScore !== null;
  const pct = attempted ? Math.round(bestQuizScore/QUIZ.length*100) : null;
  const grade = letterGrade(attempted?pct:null);
  const overallItems = qcDone + (attempted?1:0);
  const overallTotal = LESSONS.length+1;
  const overallPct = Math.round(overallItems/overallTotal*100);
  const now = new Date();
  el('toolPanel').innerHTML =
    '<h2 style="color:#67e8f9;margin-top:0">Report Card</h2>'+
    '<p style="color:var(--muted);font-size:12px;margin-top:-6px">Full-Stack-Job-Board &middot; generated '+now.toLocaleDateString()+' '+now.toLocaleTimeString()+'</p>'+
    '<div class="report-overall"><span class="big '+grade.cls+'">'+grade.text+'</span><span style="color:var(--muted);font-size:13px">Final quiz grade'+(attempted?'':' (not yet taken)')+'</span></div>'+
    '<h4>Lessons</h4><div class="report-row"><span>Quick checks completed</span><span class="grade">'+qcDone+' / '+LESSONS.length+'</span></div>'+
    '<h4>Final Quiz</h4><div class="report-row"><span>Best score</span><span class="grade">'+(attempted?(bestQuizScore+' / '+QUIZ.length+' ('+pct+'%)'):'Not attempted')+'</span></div>'+
    '<h4>Overall</h4><div class="report-row"><span>Lessons + quiz completed</span><span class="grade">'+overallItems+' / '+overallTotal+' ('+overallPct+'%)</span></div>'+
    '<button class="ghost" id="printBtn" style="margin-top:16px">🖨️ Print / Save as PDF</button>'+
    '<p style="color:var(--muted);font-size:11px;margin-top:8px">In the print dialog, choose <b>Save as PDF</b> and save it into this project\'s <code>docs/</code> folder to keep a dated record.</p>';
  el('printBtn').onclick = ()=>window.print();
}
function openReportCard(){
  document.querySelector('main').style.display='none';
  document.querySelector('nav').style.display='none';
  el('quizPanel').style.display='none';
  el('toolPanel').style.display='block';
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el('reportpill').classList.add('active');
  renderReportCard();
}

const pills=el('pills');
LESSONS.forEach((l,idx)=>{const b=document.createElement('div');b.className='pill';b.textContent=l.short;b.onclick=()=>{showLesson();i=idx;render();};pills.appendChild(b);});
const qp=document.createElement('div');qp.className='pill';qp.id='quizpill';qp.textContent='✓ Quiz';qp.onclick=openQuiz;pills.appendChild(qp);
const rp=document.createElement('div');rp.className='pill';rp.id='reportpill';rp.textContent='📊 Report Card';rp.onclick=openReportCard;pills.appendChild(rp);
render();
</script>
</body>
</html>
